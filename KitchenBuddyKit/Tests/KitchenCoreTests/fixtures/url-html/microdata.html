<!doctype html><html><body>
<article itemscope itemtype="http://schema.org/Recipe">
  <h1 itemprop="name">Grandma's Tomato Soup</h1>
  <p itemprop="description">A pantry soup that tastes like a garden.</p>
  <img itemprop="image" src="https://example.com/soup.jpg">
  <meta itemprop="prepTime" content="PT5M">
  <time itemprop="cookTime" datetime="PT25M">25 minutes</time>
  <span itemprop="recipeYield">4</span>
  <ul>
    <li itemprop="recipeIngredient">1 tbsp butter</li>
    <li itemprop="recipeIngredient">1 onion, diced</li>
    <li itemprop="recipeIngredient">2 cans (14 oz) crushed tomatoes</li>
    <li itemprop="recipeIngredient">2 cups vegetable stock</li>
  </ul>
  <ol>
    <li itemprop="recipeInstructions">Soften the onion in butter.</li>
    <li itemprop="recipeInstructions">Add tomatoes and stock; simmer 20 minutes.</li>
    <li itemprop="recipeInstructions">Blend and season.</li>
  </ol>
</article></body></html>
